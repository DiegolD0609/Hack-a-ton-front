server {
    listen __PORT__;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    resolver __DNS_RESOLVER__ valid=10s;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Railway probes this endpoint on the dynamically assigned service port.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Static assets: long cache ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API proxy to backend ──
    # Forwards /api/* requests to your backend service.
    # Set BACKEND_URL at runtime:
    #   docker run -e BACKEND_URL=http://backend:8000 ...
    #
    # The entrypoint script replaces __BACKEND_URL__ with
    # the actual value before nginx starts.
    location /api/ {
        set $backend_url "__BACKEND_URL__";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # ── SPA fallback ──
    # All other routes serve index.html so React Router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
