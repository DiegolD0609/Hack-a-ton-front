services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_DEMO_TOKEN: ${VITE_DEMO_TOKEN:-replace-with-a-shared-demo-token}
        VITE_RUNTIME_POLLING: ${VITE_RUNTIME_POLLING:-true}
    ports:
      - "3000:80"
    environment:
      # The backend and PostgreSQL live in their own Railway service.
      # Override this with http://host.docker.internal:8000 only when testing
      # a local backend from Docker Desktop.
      - BACKEND_URL=${BACKEND_URL:-https://hack-a-ton-end-production.up.railway.app}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
