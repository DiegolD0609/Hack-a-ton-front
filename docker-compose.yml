services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_DEMO_TOKEN: ${VITE_DEMO_TOKEN:-replace-with-a-shared-demo-token}
        VITE_RUNTIME_POLLING: ${VITE_RUNTIME_POLLING:-true}
    ports:
      - "3000:80"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
