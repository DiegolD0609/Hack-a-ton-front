services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:80"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    depends_on:
      - backend
    restart: unless-stopped

  # ── Your backend service ──
  # Uncomment and configure when your backend is ready.
  backend:
    image: your-backend-image:latest
    # build:
    #   context: ../your-backend-repo
    ports:
      - "8000:8000"
    # environment:
    #   - DATABASE_URL=postgresql://user:pass@db:5432/hackaton
    restart: unless-stopped
